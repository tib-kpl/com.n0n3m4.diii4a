# Builds the arm64 release APK of this fork, with every game (the default "github" flavor, as
# android_armv8_release.yml: the "idtech" one of android.yml leaves Xash3D, Source and Serious Sam out),
# and publishes it as a GitHub release (a plain .apk, the last releases kept).
#
# The engine groups are those of android.yml, built with the same options, but the first two on
# runners of their own at the same time: the Source engine libraries and the idTech4 ones, then
# everything else with the APK, which takes the libraries of the first two (Q3E/libs, as android.yml
# copies them there). Each group keeps its own ccache, so that one does not push the others out.

name: Android release APK (arm64) -> GitHub release

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Q3E/**'
      - 'idTech4Amm/**'
      - 'doom3/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ARCH: arm64-v8a
  CCACHE_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache,-DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  # ---------------------------------------------------------------- the engine groups built alone
  engines:
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: source
            # android.yml's "Build Source libraries"
            options: -DGAME_DOOM3=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF,-DGAME_TDM=OFF,-DGAME_DOOM3BFG=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_FTEQW=OFF,-DGAME_JK=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_REALRTCW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_XASH3D=OFF
            remove: ""
            libs: libsource*.so
          - group: idtech4
            # android.yml's "Build idTech4"
            options: -DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_FTEQW=OFF,-DGAME_JK=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_REALRTCW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_SOURCE=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF,-DGAME_XASH3D=OFF
            remove: Q3E/src/main/jni/source
            libs: libdoom3.so libquake4.so libprey.so libRBDoom3BFG*.so libTheDarkMod.so libgame.so libd3xp.so libcdoom.so libd3le.so libfraggingfree.so libhardcorps.so libhexeneoc.so liblibrecoop.so liblibrecoopxp.so liboverthinked.so libperfected.so libperfected_roe.so librivensin.so libsabot.so libtfphobos.so libq4game.so libq4xbase.so libhazzzzzy.so libhardqore.so libpreygame.so libetqw.so libetqwgame.so libqc.so libICARUS.so
    name: engines (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Mount working directory
        run: |
          u=`whoami`
          sudo mkdir /mnt/diii4a
          sudo chown $u /mnt -R
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup jdk 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: diii4a-arm64-${{ matrix.group }}
          max-size: 3G

      - name: Configure ccache
        run: |
          # smaller entries, and no miss for what does not change the result
          ccache --set-config=compression_level=9
          ccache --set-config=sloppiness=time_macros,locale,include_file_mtime,include_file_ctime
          ccache --set-config=base_dir=/mnt/diii4a
          ccache -p | grep -E "max_size|compression|sloppiness|base_dir"

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential

      - name: Build
        run: |
          mv ./* /mnt/diii4a/
          cd /mnt/diii4a
          chmod +x ./gradlew
          rm -rf Q3E/libs/armeabi-v7a
          if [ -n "${{ matrix.remove }}" ]; then rm -rf ${{ matrix.remove }}; fi
          ./gradlew assembleRelease -Pabifilters=${ARCH} -Pcmake_options=${CCACHE_FLAGS},${{ matrix.options }}
          mkdir -p $GITHUB_WORKSPACE/engine-libs
          cd Q3E/build/intermediates/library_jni/release/jni/${ARCH}
          cp -f ${{ matrix.libs }} $GITHUB_WORKSPACE/engine-libs/
          ls -l $GITHUB_WORKSPACE/engine-libs
          df -h

      - name: Keep the libraries
        uses: actions/upload-artifact@v4
        with:
          name: engine-libs-${{ matrix.group }}
          path: engine-libs/*.so
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------- everything else, the APK, the release
  build-android:
    needs: engines
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Mount working directory
        run: |
          u=`whoami`
          sudo mkdir /mnt/diii4a
          sudo chown $u /mnt -R
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read the version
        id: version
        run: |
          version=$(grep -m1 "versionName" idTech4Amm/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Setup jdk 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: diii4a-arm64-rest
          max-size: 3G

      - name: Configure ccache
        run: |
          ccache --set-config=compression_level=9
          ccache --set-config=sloppiness=time_macros,locale,include_file_mtime,include_file_ctime
          ccache --set-config=base_dir=/mnt/diii4a
          ccache -p | grep -E "max_size|compression|sloppiness|base_dir"

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential

      - name: Libraries of the Source engine
        uses: actions/download-artifact@v4
        with:
          name: engine-libs-source
          path: engine-libs

      - name: Libraries of idTech4
        uses: actions/download-artifact@v4
        with:
          name: engine-libs-idtech4
          path: engine-libs

      - name: Build with Gradle
        run: |
          mv ./* /mnt/diii4a/
          cd /mnt/diii4a
          chmod +x ./gradlew
          rm -rf Q3E/libs/armeabi-v7a
          mkdir -p Q3E/libs/${ARCH}
          cp -f engine-libs/*.so Q3E/libs/${ARCH}/
          ls Q3E/libs/${ARCH}
          # android.yml's "Build final apk"
          rm -rf Q3E/src/main/jni/source
          rm -rf Q3E/src/main/jni/doom3/neo/[^es]*
          rm -rf Q3E/src/main/jni/doom3bfg
          ./gradlew assembleRelease -Pabifilters=${ARCH} -Pcmake_options=${CCACHE_FLAGS},-DGAME_SOURCE=OFF,-DGAME_DOOM3=OFF,-DGAME_DOOM3BFG=OFF,-DGAME_TDM=OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF
          df -h

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p apks
          cp /mnt/diii4a/idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk apks/idTech4Amm-arm64.apk
          ls -l apks
          tag="build-${{ github.run_number }}"
          gh release create "$tag" apks/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} (${{ steps.version.outputs.version }}, arm64)" \
            --notes "Release APK for arm64 with every game, built from ${{ github.sha }}."
          # keep the last 5 releases
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +6 | while read old; do
                gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag || true
              done
