# Builds the arm64 release APK of this fork, with every game (the default "github" flavor, as
# android_armv8_release.yml: the "idtech" one of android.yml leaves Xash3D, Source and Serious Sam out), and publishes it as a GitHub release
# (a plain .apk, the last releases kept). The build steps are those of android.yml (the testing build
# of the project); only the publishing differs: android.yml publishes to the upstream repository with a
# token only its owner has, this one uses the fork's own.

name: Android release APK (arm64) -> GitHub release

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Q3E/**'
      - 'idTech4Amm/**'
      - 'doom3/**'
      - 'CMakeLists.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Mound working directory
        run: |
          u=`whoami`
          sudo mkdir /mnt/diii4a
          sudo chown $u /mnt -R
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read the version
        id: version
        run: |
          version=$(grep -m1 "versionName" idTech4Amm/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Setup jdk 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: diii4a-arm64
          max-size: 5G

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential

      - name: Build with Gradle
        run: |
          echo "Move to working directory"
          mv ./* /mnt/diii4a/
          cd /mnt/diii4a
          echo "work directory: `pwd`"
          chmod +x ./gradlew
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          arch=arm64-v8a
          barch="-Pabifilters=${arch}"
          # remove 32-bit libraries
          echo "Remove 32-bit libraries"
          rm -rf Q3E/libs/armeabi-v7a
          # build Source only
          echo "Clean builds"
          ./gradlew clean $bargs
          rm -rf Q3E/.cxx Q3E/build idTech4Amm/build
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          echo "Build Source libraries"
          # ,-DBUILD_SOURCE_HL2=OFF,-DBUILD_SOURCE_HL2MP=OFF,-DBUILD_SOURCE_EPISODIC=OFF,-DBUILD_SOURCE_HL1=OFF,-DBUILD_SOURCE_HL1MP=OFF,-DBUILD_SOURCE_PORTAL=OFF
          bargs="$barch -Pcmake_options=-DCMAKE_C_COMPILER_LAUNCHER=ccache,-DCMAKE_CXX_COMPILER_LAUNCHER=ccache,-DGAME_DOOM3=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF,-DGAME_TDM=OFF,-DGAME_DOOM3BFG=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_FTEQW=OFF,-DGAME_JK=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_REALRTCW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_XASH3D=OFF"
          ./gradlew assembleRelease $bargs
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          echo "Copy Source libraries to libs"
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libsource*so Q3E/libs/${arch} || true
          ls Q3E/libs/${arch}
          # build idTech4 only
          echo "Clean builds"
          ./gradlew clean $bargs
          rm -rf Q3E/.cxx Q3E/build idTech4Amm/build
          rm -rf Q3E/src/main/jni/source
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          echo "Build idTech4"
          bargs="$barch -Pcmake_options=-DCMAKE_C_COMPILER_LAUNCHER=ccache,-DCMAKE_CXX_COMPILER_LAUNCHER=ccache,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_FTEQW=OFF,-DGAME_JK=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_REALRTCW=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_SOURCE=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF,-DGAME_XASH3D=OFF"
          ./gradlew assembleRelease $bargs
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          echo "Copy idTech4 libraries to libs"
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libdoom3.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libquake4.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libprey.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libRBDoom3BFG*.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libTheDarkMod.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libgame.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libd3xp.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libcdoom.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libd3le.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libfraggingfree.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libhardcorps.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libhexeneoc.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/liblibrecoop.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/liblibrecoopxp.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/liboverthinked.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libperfected.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libperfected_roe.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/librivensin.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libsabot.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libtfphobos.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libq4game.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libq4xbase.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libhazzzzzy.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libhardqore.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libpreygame.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libetqw.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libetqwgame.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libqc.so Q3E/libs/${arch}
          cp -f Q3E/build/intermediates/library_jni/release/jni/${arch}/libICARUS.so Q3E/libs/${arch}
          ls Q3E/libs/${arch}
          # build non-idTech4 only
          echo "Clean builds"
          ./gradlew clean $bargs
          rm -rf Q3E/.cxx Q3E/build idTech4Amm/build
          rm -rf Q3E/src/main/jni/source
          rm -rf Q3E/src/main/jni/doom3/neo/[^es]*
          rm -rf Q3E/src/main/jni/doom3bfg
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"
          echo "Build final apk"
          bargs="$barch -Pcmake_options=-DCMAKE_C_COMPILER_LAUNCHER=ccache,-DCMAKE_CXX_COMPILER_LAUNCHER=ccache,-DGAME_SOURCE=OFF,-DGAME_DOOM3=OFF,-DGAME_DOOM3BFG=OFF,-DGAME_TDM=OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF"
          ./gradlew assembleRelease $bargs
          echo "disk usage: >>>"
          df -h
          du -ch | tail -n -1
          echo "<<< disk usage"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p apks
          cp /mnt/diii4a/idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk apks/idTech4Amm-arm64.apk
          ls -l apks
          tag="build-${{ github.run_number }}"
          gh release create "$tag" apks/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} (${{ steps.version.outputs.version }}, arm64)" \
            --notes "Release APK for arm64 with every game, built from ${{ github.sha }}."
          # keep the last 5 releases
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +6 | while read old; do
                gh release delete "$old" --repo "${{ github.repository }}" --yes --cleanup-tag || true
              done
